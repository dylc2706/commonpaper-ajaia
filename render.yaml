services:
  - type: web
    name: commonpaper-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: commonpaper-db
          property: connectionString

databases:
  - name: commonpaper-db
    databaseName: commonpaper
    user: commonpaper
    plan: free
